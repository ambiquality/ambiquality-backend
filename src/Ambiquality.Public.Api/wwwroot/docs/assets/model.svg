<?xml version="1.0" encoding="UTF-8"?>
<!-- UML diagram tříd: konceptuální model měření kvality vnitřního prostředí (IEQ).
     Ukotveno v ontologii SOSA/SSN; jmenný prostor ambiq: = https://data.ambiquality.org/ns#.
     Konceptuální úroveň: uvádějí se názvy atributů a volitelnost ([0..1]), nikoli datové typy.
     Styl odpovídá diagramům tříd na ofn.gov.cz. -->
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600"
     font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"
     aria-label="UML diagram tříd: třída Pozorování (sosa:Observation) je asociacemi spojena se Sledovanou vlastností (sosa:observedProperty, 1), Senzorem (sosa:madeBySensor, 1) a Místností coby předmětem zájmu (sosa:hasFeatureOfInterest, 0..1); Senzor je umístěn v Místnosti (ambiq:room, 1) a Místnost patří do Budovy (ambiq:building, 1).">
  <defs>
    <!-- otevřená šipka navigovatelné asociace -->
    <marker id="nav" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#3b4b52" stroke-width="1.4"/>
    </marker>
    <style>
      .box  { fill:#ffffff; stroke:#057fa5; stroke-width:1.5; }
      .hdr  { fill:#057fa5; }
      .sep  { stroke:#057fa5; stroke-width:1; }
      .ster { font-size:10px; font-style:italic; fill:#dff1f6; }
      .name { font-size:14px; font-weight:700; fill:#ffffff; }
      .attr { font-size:12px; fill:#1f3036; }
      .edge { stroke:#3b4b52; stroke-width:1.4; fill:none; }
      .role { font-size:11.5px; fill:#243a42; font-family:monospace; }
      .mult { font-size:11px; fill:#243a42; }
    </style>
  </defs>

  <!-- ============ Pozorování (sosa:Observation) ============ -->
  <g>
    <rect class="box" x="330" y="16" width="200" height="131" rx="3"/>
    <path class="hdr" d="M330 19 a3 3 0 0 1 3 -3 h194 a3 3 0 0 1 3 3 v35 h-200 z"/>
    <text class="ster" x="430" y="31" text-anchor="middle">«sosa:Observation»</text>
    <text class="name" x="430" y="47" text-anchor="middle">Pozorování</text>
    <line class="sep" x1="330" y1="54" x2="530" y2="54"/>
    <text class="attr" x="340" y="73">+ value</text>
    <text class="attr" x="340" y="90">+ observedAt</text>
    <text class="attr" x="340" y="107">+ receivedAt</text>
    <text class="attr" x="340" y="124">+ isInvalid</text>
    <text class="attr" x="340" y="141">+ unit [0..1]</text>
  </g>

  <!-- ============ Sledovaná vlastnost (sosa:ObservableProperty) ============ -->
  <g>
    <rect class="box" x="20" y="210" width="248" height="114" rx="3"/>
    <path class="hdr" d="M20 213 a3 3 0 0 1 3 -3 h242 a3 3 0 0 1 3 3 v35 h-248 z"/>
    <text class="ster" x="144" y="225" text-anchor="middle">«sosa:ObservableProperty»</text>
    <text class="name" x="144" y="241" text-anchor="middle">Sledovaná vlastnost</text>
    <line class="sep" x1="20" y1="248" x2="268" y2="248"/>
    <text class="attr" x="30" y="267">+ kód</text>
    <text class="attr" x="30" y="284">+ název</text>
    <text class="attr" x="30" y="301">+ typVeličiny [0..1]</text>
    <text class="attr" x="30" y="318">+ jednotka [0..1]</text>
  </g>

  <!-- ============ Senzor (sosa:Sensor) ============ -->
  <g>
    <rect class="box" x="600" y="210" width="240" height="97" rx="3"/>
    <path class="hdr" d="M600 213 a3 3 0 0 1 3 -3 h234 a3 3 0 0 1 3 3 v35 h-240 z"/>
    <text class="ster" x="720" y="225" text-anchor="middle">«sosa:Sensor»</text>
    <text class="name" x="720" y="241" text-anchor="middle">Senzor</text>
    <line class="sep" x1="600" y1="248" x2="840" y2="248"/>
    <text class="attr" x="610" y="267">+ výrobce [0..1]</text>
    <text class="attr" x="610" y="284">+ model [0..1]</text>
    <text class="attr" x="610" y="301">+ stav [0..1]</text>
  </g>

  <!-- ============ Místnost (ambiq:Room) — předmět zájmu ============ -->
  <g>
    <rect class="box" x="330" y="350" width="200" height="97" rx="3"/>
    <path class="hdr" d="M330 353 a3 3 0 0 1 3 -3 h194 a3 3 0 0 1 3 3 v35 h-200 z"/>
    <text class="ster" x="430" y="365" text-anchor="middle">«ambiq:Room»</text>
    <text class="name" x="430" y="381" text-anchor="middle">Místnost</text>
    <line class="sep" x1="330" y1="388" x2="530" y2="388"/>
    <text class="attr" x="340" y="407">+ podlaží</text>
    <text class="attr" x="340" y="424">+ funkce [0..1]</text>
    <text class="attr" x="340" y="441">+ dobaPobytu [0..1]</text>
  </g>

  <!-- ============ Budova (ambiq:Building) ============ -->
  <g>
    <rect class="box" x="330" y="480" width="200" height="97" rx="3"/>
    <path class="hdr" d="M330 483 a3 3 0 0 1 3 -3 h194 a3 3 0 0 1 3 3 v35 h-200 z"/>
    <text class="ster" x="430" y="495" text-anchor="middle">«ambiq:Building»</text>
    <text class="name" x="430" y="511" text-anchor="middle">Budova</text>
    <line class="sep" x1="330" y1="518" x2="530" y2="518"/>
    <text class="attr" x="340" y="537">+ název [0..1]</text>
    <text class="attr" x="340" y="554">+ adresa</text>
    <text class="attr" x="340" y="571">+ typ [0..1]</text>
  </g>

  <!-- ============ asociace ============ -->
  <!-- Pozorování -> Sledovaná vlastnost : observedProperty [1] -->
  <path class="edge" marker-end="url(#nav)" d="M330 120 L200 210"/>
  <text class="role" x="232" y="166" text-anchor="end">sosa:observedProperty</text>
  <text class="mult" x="210" y="205">1</text>

  <!-- Pozorování -> Senzor : madeBySensor [1] -->
  <path class="edge" marker-end="url(#nav)" d="M530 120 L660 210"/>
  <text class="role" x="628" y="166" text-anchor="start">sosa:madeBySensor</text>
  <text class="mult" x="648" y="205">1</text>

  <!-- Pozorování -> Místnost : hasFeatureOfInterest [0..1] -->
  <path class="edge" marker-end="url(#nav)" d="M430 147 L430 350"/>
  <text class="role" x="438" y="246" text-anchor="start">sosa:hasFeatureOfInterest</text>
  <text class="mult" x="438" y="344">0..1</text>

  <!-- Senzor -> Místnost : room [1] -->
  <path class="edge" marker-end="url(#nav)" d="M660 307 L532 392"/>
  <text class="role" x="600" y="368" text-anchor="middle">ambiq:room</text>
  <text class="mult" x="542" y="392">1</text>

  <!-- Místnost -> Budova : building [1] -->
  <path class="edge" marker-end="url(#nav)" d="M430 447 L430 480"/>
  <text class="role" x="438" y="467" text-anchor="start">ambiq:building</text>
  <text class="mult" x="438" y="477">1</text>
</svg>
