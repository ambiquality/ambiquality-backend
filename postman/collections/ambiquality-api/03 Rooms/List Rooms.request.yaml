$kind: http-request
name: List Rooms
url: "{{baseUrl}}/evidence/buildings/{{buildingId}}/rooms"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Returns an array', () => pm.expect(j).to.be.an('array'));
      pm.test('Includes the created room', () =>
        pm.expect(j.map(r => r.id)).to.include(pm.collectionVariables.get('roomId')));
    language: text/javascript
order: 1500
