$kind: http-request
url: "{{baseUrl}}/evidence/v1/buildings/{{buildingId}}/rooms/{{roomId}}/pollution-sources"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"sourceCode": "chemicals","validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 10000
