$kind: http-request
url: "{{baseUrl}}/evidence/v1/buildings/{{buildingId}}/rooms/{{roomId}}/geometry"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"areaM2": 42.0,"ceilingHeightM": 3.0,"validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 8000
