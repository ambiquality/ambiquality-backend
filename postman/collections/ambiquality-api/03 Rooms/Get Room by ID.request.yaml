$kind: http-request
url: "{{baseUrl}}/evidence/buildings/{{buildingId}}/rooms/{{roomId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Shape: id, uriSlug, buildingId, name, floor', () => {
        pm.expect(j).to.include.all.keys('id', 'uriSlug', 'buildingId', 'name', 'floor');
      });
    language: text/javascript
order: 2000
