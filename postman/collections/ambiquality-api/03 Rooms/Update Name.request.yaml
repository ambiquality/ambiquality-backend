$kind: http-request
url: "{{baseUrl}}/evidence/v1/buildings/{{buildingId}}/rooms/{{roomId}}/name"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"newValue": "Conference Room 101","validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 4000
