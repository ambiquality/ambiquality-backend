$kind: http-request
url: "{{baseUrl}}/evidence/buildings/{{buildingId}}/rooms/{{roomId}}/sensors/{{sensorId}}/identity"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"manufacturer": "Aranet","model": "Aranet4 Pro","serialNumber": "SN-000001-PRO","validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 4000
