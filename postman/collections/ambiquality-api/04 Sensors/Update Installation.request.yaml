$kind: http-request
url: "{{baseUrl}}/evidence/v1/buildings/{{buildingId}}/rooms/{{roomId}}/sensors/{{sensorId}}/installation"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"positionNote": "wall-mounted, 1.5 m above floor","distanceWindowM": 2.5,"distanceDoorM": 3.0,"distanceSourceM": 4.0,"measurementFrequencySeconds": 300,"installedOn": "2026-06-01","lastCalibratedOn": "2026-06-05","validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5400
