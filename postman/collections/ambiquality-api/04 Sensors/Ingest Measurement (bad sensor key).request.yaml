$kind: http-request
url: "{{baseUrl}}/ingestion/measurements"
method: POST
headers:
  Content-Type: application/json
  X-Sensor-Key: not-a-real-key
body:
  type: json
  content: '{"sensorId": "{{sensorId}}","parameterCode": "co2","value": 800,"observedAt": "{{now}}"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 401 bad sensor key', () => pm.response.to.have.status(401));
    language: text/javascript
order: 1300
