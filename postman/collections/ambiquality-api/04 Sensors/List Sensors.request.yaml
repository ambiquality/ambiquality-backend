$kind: http-request
name: List Sensors
url: "{{baseUrl}}/evidence/v1/buildings/{{buildingId}}/rooms/{{roomId}}/sensors"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Returns an array', () => pm.expect(j).to.be.an('array'));
      pm.test('Includes the created sensor', () =>
        pm.expect(j.map(s => s.id)).to.include(pm.collectionVariables.get('sensorId')));
    language: text/javascript
order: 1500
