$kind: http-request
url: "{{baseUrl}}/evidence/v1/buildings/{{buildingId}}/rooms/{{roomId}}/sensors/{{sensorId}}/placement"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"newRoomId": "{{roomId}}","validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
