$kind: http-request
url: "{{baseUrl}}/evidence/buildings/{{buildingId}}/rooms/{{roomId}}/sensors/{{sensorId}}/measured-parameters"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"parameterCode": "light","validFrom": "{{now}}"}'
scripts:
