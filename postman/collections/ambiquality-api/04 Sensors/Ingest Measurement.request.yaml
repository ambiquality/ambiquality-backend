$kind: http-request
url: "{{baseUrl}}/ingestion/v1/measurements"
method: POST
headers:
  Content-Type: application/json
  X-Sensor-Key: "{{sensorApiKey}}"
body:
  type: json
  content: '{"sensorId": "{{sensorId}}","readings": [{"parameterCode": "co2","value": 800,"unit": "ppm"},{"parameterCode": "temperature","value": 21.5,"unit": "°C"}]}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 202 accepted', () => pm.response.to.have.status(202));
      const j = pm.response.json();
      pm.test('Has receivedAt and one measurement per reading', () => {
        pm.expect(j).to.have.property('receivedAt');
        pm.expect(j.measurements).to.be.an('array').with.lengthOf(2);
        j.measurements.forEach(m => {
          pm.expect(m.id).to.be.a('string').and.not.empty;
          pm.expect(m).to.have.property('parameterCode');
        });
      });
    language: text/javascript
order: 1100
