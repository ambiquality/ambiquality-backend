$kind: http-request
url: "{{baseUrl}}/public/v1/observations.csv"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Content-Type is text/csv', () =>
        pm.expect(pm.response.headers.get('Content-Type')).to.include('text/csv'));
      pm.test('Link header advertises CSVW schema (describedby)', () =>
        pm.expect(pm.response.headers.get('Link') || '').to.include('describedby'));
    language: text/javascript
order: 6000
