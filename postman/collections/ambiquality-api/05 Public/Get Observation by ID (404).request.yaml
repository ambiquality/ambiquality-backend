$kind: http-request
url: "{{baseUrl}}/public/v1/observations/00000000-0000-0000-0000-000000000000"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 404 for unknown observation', () => pm.response.to.have.status(404));
    language: text/javascript
order: 5000
