$kind: http-request
url: "{{baseUrl}}/public/v1/catalog"
method: GET
headers:
  Accept: application/ld+json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Content-Type is application/ld+json', () =>
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/ld+json'));
      const j = pm.response.json();
      pm.test('Is a DCAT Catalog with datasets', () => {
        pm.expect(j).to.have.property('@type');
        pm.expect(j).to.have.property('dcat:dataset');
      });
    language: text/javascript
order: 9000
