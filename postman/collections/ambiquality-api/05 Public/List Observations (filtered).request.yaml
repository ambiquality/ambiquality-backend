$kind: http-request
url: "{{baseUrl}}/public/v1/observations/?parameterCode=co2&limit=10"
method: GET
queryParams:
  parameterCode: co2
  limit: "10"
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Items array within requested limit', () => {
        pm.expect(j.items).to.be.an('array');
        pm.expect(j.items.length).to.be.at.most(10);
      });
    language: text/javascript
order: 4000
