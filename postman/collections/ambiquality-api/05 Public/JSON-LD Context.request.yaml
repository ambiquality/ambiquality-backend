$kind: http-request
url: "{{baseUrl}}/public/v1/context/measurements.jsonld"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Has @context', () => pm.expect(j).to.have.property('@context'));
    language: text/javascript
order: 7000
