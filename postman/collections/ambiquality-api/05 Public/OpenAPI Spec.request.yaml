$kind: http-request
url: "{{baseUrl}}/public/openapi/v1.json"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Is an OpenAPI document', () => pm.expect(j).to.have.property('openapi'));
    language: text/javascript
order: 16000
