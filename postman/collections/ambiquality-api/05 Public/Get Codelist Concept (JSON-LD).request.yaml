$kind: http-request
url: "{{baseUrl}}/public/v1/codelists/building-type/office"
method: GET
headers:
  Accept: application/ld+json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Content-Type is application/ld+json', () =>
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/ld+json'));
      const j = pm.response.json();
      pm.test('Is a SKOS concept with notation and bilingual prefLabel', () => {
        pm.expect(j['@type']).to.equal('skos:Concept');
        pm.expect(j['skos:notation']).to.equal('office');
        const langs = j['skos:prefLabel'].map(l => l['@language']);
        pm.expect(langs).to.include.members(['cs', 'en']);
      });
    language: text/javascript
order: 9200
