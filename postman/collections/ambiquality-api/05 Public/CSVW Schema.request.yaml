$kind: http-request
url: "{{baseUrl}}/public/v1/schema/observations.csv-metadata.json"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Has tableSchema', () => pm.expect(j).to.have.property('tableSchema'));
    language: text/javascript
order: 8000
