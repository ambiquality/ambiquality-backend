$kind: http-request
url: "{{baseUrl}}/auth/account/confirm-email-change?token={{changeToken}}"
method: GET
queryParams:
  token: "{{changeToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
  - type: beforeRequest
    code: |-
      const mp = pm.variables.get('mailpitBaseUrl') || 'http://localhost:8025';
        const to = pm.variables.get('newEmail');
        pm.sendRequest(mp + '/api/v1/messages', function (err, res) {
          if (err) { console.error(err); return; }
          const msgs = (res.json().messages) || [];
          const hit = msgs.find(function (x) { return JSON.stringify(x.To || []).indexOf(to) >= 0; });
          if (!hit) { console.error('no change email for ' + to); return; }
          pm.sendRequest(mp + '/api/v1/message/' + hit.ID, function (e2, r2) {
            if (e2) { console.error(e2); return; }
            const b = r2.json().Text || '';
            if (b.indexOf('token=') < 0) { console.error('no link'); return; }
            pm.collectionVariables.set('changeToken', b.split('token=')[1].split('\n')[0].trim());
          });
        });
    language: text/javascript
order: 9000
