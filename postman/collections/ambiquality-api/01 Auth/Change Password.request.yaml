$kind: http-request
url: "{{baseUrl}}/auth/v1/account/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"currentPassword": "{{password}}","newPassword": "{{password}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
