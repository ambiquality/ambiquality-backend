$kind: http-request
url: "{{baseUrl}}/auth/account/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Shape: id, email, emailConfirmed', () => {
        pm.expect(j).to.include.all.keys('id', 'email', 'emailConfirmed');
      });
    language: text/javascript
order: 4000
