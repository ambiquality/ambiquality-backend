$kind: http-request
url: "{{baseUrl}}/auth/v1/resend-confirmation"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email": "{{email}}"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 202', () => pm.response.to.have.status(202));
    language: text/javascript
order: 7000
