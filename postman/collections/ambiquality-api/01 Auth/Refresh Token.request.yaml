$kind: http-request
url: "{{baseUrl}}/auth/v1/refresh"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Returns accessToken and rotates the refresh cookie', () => {
        pm.expect(j.accessToken).to.be.a('string').and.not.empty;
        // Rotation: the server always re-sets the HttpOnly refresh cookie.
        pm.expect(pm.response.headers.get('set-cookie')).to.include('amq_refresh=');
      });
      pm.collectionVariables.set('accessToken', j.accessToken);
    language: text/javascript
order: 3000
