$kind: http-request
url: "{{baseUrl}}/evidence/buildings/{{buildingId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Shape: id, uriSlug, name, city, buildingTypeCode', () => {
        pm.expect(j).to.include.all.keys('id', 'uriSlug', 'name', 'city', 'buildingTypeCode');
      });
    language: text/javascript
order: 2000
