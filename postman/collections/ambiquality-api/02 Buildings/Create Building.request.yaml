$kind: http-request
name: Create Building
url: "{{baseUrl}}/evidence/v1/buildings/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Faculty of Informatics and Economics",
        "addressPointCode": 21794547,
        "streetName": "Žižkova",
        "houseNumber": 11,
        "houseNumberType": "č.p.",
        "orientationNumber": null,
        "orientationNumberLetter": null,
        "municipalityName": "Praha",
        "municipalityPartName": "Žižkov",
        "psc": "13000",
        "districtName": "Hlavní město Praha",
        "regionName": "Hlavní město Praha",
        "buildingTypeCode": "office",
        "latitude": 50.0815,
        "longitude": 14.4391,
        "yearBuilt": 1962,
        "yearRenovated": 2005
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const j = pm.response.json();
      pm.test('Has id and uriSlug', () => {
        pm.expect(j.id).to.be.a('string').and.not.empty;
        pm.expect(j.uriSlug).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('buildingId', j.id);
      pm.collectionVariables.set('buildingSlug', j.uriSlug);
    language: text/javascript
order: 1000
