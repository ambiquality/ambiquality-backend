$kind: http-request
url: "{{baseUrl}}/evidence/buildings/{{buildingId}}/years"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"yearBuilt": 1962,"yearRenovated": 2010,"validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 8000
