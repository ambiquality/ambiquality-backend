$kind: http-request
name: List Buildings
url: "{{baseUrl}}/evidence/v1/buildings"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('Returns an array', () => pm.expect(j).to.be.an('array'));
      pm.test('Includes the created building', () =>
        pm.expect(j.map(b => b.id)).to.include(pm.collectionVariables.get('buildingId')));
    language: text/javascript
order: 1500
