$kind: http-request
url: "{{baseUrl}}/evidence/v1/buildings/{{buildingId}}/type"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"newTypeCode": "warehouse","validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400 — code not in the building-type codelist', () =>
        pm.response.to.have.status(400));
    language: text/javascript
order: 6100
