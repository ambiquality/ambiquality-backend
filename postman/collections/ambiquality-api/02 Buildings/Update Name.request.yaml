$kind: http-request
url: "{{baseUrl}}/evidence/buildings/{{buildingId}}/name"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"newName": "Faculty of Business Administration","validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 4000
