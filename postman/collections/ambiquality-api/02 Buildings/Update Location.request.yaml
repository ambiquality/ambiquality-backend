$kind: http-request
url: "{{baseUrl}}/evidence/v1/buildings/{{buildingId}}/location"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"latitude": 50.082,"longitude": 14.44,"validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 7000
