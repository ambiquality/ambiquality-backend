$kind: http-request
url: "{{baseUrl}}/evidence/buildings/{{buildingId}}/address"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"street": "Zizkova 11","city": "Prague 3","postcode": "130 67","country": "CZ","validFrom": "{{now}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
