name: Wiki

# Build the mdBook wiki (docs/wiki) and publish it to GitHub Pages on every push to
# main that touches the book. Served at the custom domain wiki.ambiquality.org (CNAME
# written into the artifact below). PRs build but do not deploy, so a broken book fails
# the check before it can ship.
on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: wiki-pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: '0.4.40'

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mdBook
        run: |
          tarball="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${tarball}"
          curl -sSL "$url" | tar -xz -C /usr/local/bin
          mdbook --version

      - name: Build
        run: mdbook build docs/wiki

      - name: Add CNAME for custom domain
        run: echo 'wiki.ambiquality.org' > docs/wiki/book/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/wiki/book

  deploy:
    name: Deploy to Pages
    # Only publish from main, never from PRs.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
