secrets:
  jwt-signing-key:
    environment: "JWT_SECRET"
services:
  postgres:
    image: docker.io/timescale/timescaledb:2.27.0-pg18
    environment:
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb"
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432"
    networks:
        - db
    healthcheck:
      test: ["CMD-SHELL", "psql -U auth_api -d auth -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: docker.io/axllent/mailpit:latest
    networks:
      - public
    profiles:
      - development
    stop_signal: SIGINT
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=auth;Username=auth_api;Password=auth_api_dev_password"
    networks:
      - db
    restart: "no"

  evidence-migrate:
    build:
      context: .
      dockerfile: Dockerfile.evidence
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__EvidenceDb: "Host=postgres;Port=5432;Database=evidence;Username=postgres;Password=postgres"
    networks:
      - db
    restart: "no"

  evidence-api: # on port 6200
    build:
      context: .
      dockerfile: Dockerfile.evidence
    depends_on:
      evidence-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6200
      ConnectionStrings__EvidenceDb: "Host=postgres;Port=5432;Database=evidence;Username=evidence_api;Password=evidence_api_dev_password"
    ports:
      - "6200:6200"
    networks:
      - db
      - public

  ingestion-migrate:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Runs as postgres (superuser) so the migration can CREATE EXTENSION
      # timescaledb (idempotent) and create_hypertable on the ieq schema.
      ConnectionStrings__IeqDb: "Host=postgres;Port=5432;Database=ieq;Username=postgres;Password=postgres"
    networks:
      - db
    restart: "no"

  ingestion-api: # on port 6300
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully
      evidence-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6300
      # ingestion_api: read-write on ieq, read-only on the evidence catalog.
      ConnectionStrings__IeqDb: "Host=postgres;Port=5432;Database=ieq;Username=ingestion_api;Password=ingestion_api_dev_password"
      ConnectionStrings__EvidenceDb: "Host=postgres;Port=5432;Database=evidence;Username=ingestion_api;Password=ingestion_api_dev_password"
    ports:
      - "6300:6300"
    networks:
      - db
      - public

  auth-api: # on port 6100
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6100
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=auth;Username=auth_api;Password=auth_api_dev_password"
      Jwt__Issuer: "ambiquality-auth"
      Jwt__Audience: "ambiquality"
      Jwt__Secret: ${JWT_SECRET:?error}
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "30"
      Jwt__ConfirmationTokenHours: "24"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseStartTls: "false"
      Smtp__FromAddress: "no-reply@ambiquality.cz"
      Smtp__FromName: "Ambiquality"
      App__FrontendBaseUrl: "https://app.ambiquality.cz"
    networks:
      - db
      - public
  caddy:
    image: docker.io/library/caddy:2.11.3-alpine
    networks:
      - public
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
      #- ./site:/srv # static files to serve

volumes:
  postgres-data:
  mailpit-data:
  caddy_data:
  caddy_config:

networks:
  db:
  public:
  
