services:
  postgres:
    image: docker.io/timescale/timescaledb:2.27.0-pg18
    environment:
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      AUTH_API_DB_PASSWORD: ${AUTH_API_DB_PASSWORD:?error}
      EVIDENCE_API_DB_PASSWORD: ${EVIDENCE_API_DB_PASSWORD:?error}
      INGESTION_API_DB_PASSWORD: ${INGESTION_API_DB_PASSWORD:?error}
      PUBLIC_API_DB_PASSWORD: ${PUBLIC_API_DB_PASSWORD:?error}
      EXPORT_WORKER_DB_PASSWORD: ${EXPORT_WORKER_DB_PASSWORD:?error}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-databases.sql.tpl:/docker-entrypoint-initdb.d/init-databases.sql.tpl:ro
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "6432:5432"
    networks:
        - db
    healthcheck:
      test: ["CMD-SHELL", "psql -U auth_api -d auth -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    # AOF with per-write fsync: the ingestion stream is the durable write-ahead log
    # the HTTP 202 depends on, so an XADD must hit disk before it is acknowledged.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    networks:
      - db
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SPO-04: daily logical dump of auth/evidence/ieq (+ cluster globals) with local
  # retention; production must set the BACKUP_S3_* vars so each run is copied
  # off-site (storage independent from the postgres-data volume) — RPO ≤ 24 h.
  postgres-backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?error}
      BACKUP_DATABASES: "auth evidence ieq"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-postgres}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      - backup-data:/backups
    networks:
      - db
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: docker.io/axllent/mailpit:latest
    networks:
      - public
    profiles:
      - development
    stop_signal: SIGINT
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    profiles:
      - development
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?error}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./conf/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=auth;Username=auth_api;Password=${AUTH_API_DB_PASSWORD:?error}"
    networks:
      - db
    restart: "no"

  evidence-migrate:
    build:
      context: .
      dockerfile: Dockerfile.evidence
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__EvidenceDb: "Host=postgres;Port=5432;Database=evidence;Username=postgres;Password=${POSTGRES_PASSWORD:?error}"
    networks:
      - db
    restart: "no"

  evidence-api: # on port 6200
    build:
      context: .
      dockerfile: Dockerfile.evidence
    depends_on:
      evidence-migrate:
        condition: service_completed_successfully
    environment:
      Vocabulary__ExtensionsPath: /etc/ambiquality/vocabulary-extensions.json
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:6200
      ConnectionStrings__EvidenceDb: "Host=postgres;Port=5432;Database=evidence;Username=evidence_api;Password=${EVIDENCE_API_DB_PASSWORD:?error}"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET:?error}
    ports:
      - "6200:6200"
    volumes:
      - ./conf/vocabulary-extensions.json:/etc/ambiquality/vocabulary-extensions.json:ro
    networks:
      - db
      - public

  ingestion-migrate:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Runs as postgres (superuser) so the migration can CREATE EXTENSION
      # timescaledb (idempotent) and create_hypertable on the ieq schema.
      ConnectionStrings__IeqDb: "Host=postgres;Port=5432;Database=ieq;Username=postgres;Password=${POSTGRES_PASSWORD:?error}"
    networks:
      - db
    restart: "no"

  seed-dev:
    image: docker.io/timescale/timescaledb:2.27.0-pg18
    depends_on:
      migrate:
        condition: service_completed_successfully
      evidence-migrate:
        condition: service_completed_successfully
      ingestion-migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?error}
    volumes:
      - ./seed-dev.sh:/seed-dev.sh:ro
      - ./seed-dev-auth.sql:/seed-dev-auth.sql:ro
      - ./seed-dev-evidence.sql:/seed-dev-evidence.sql:ro
      - ./seed-dev-ieq.sql:/seed-dev-ieq.sql:ro
    command: ["sh", "/seed-dev.sh"]
    networks:
      - db
    restart: "no"
    profiles:
      - development

  ingestion-api: # on port 6300
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully
      evidence-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      Vocabulary__ExtensionsPath: /etc/ambiquality/vocabulary-extensions.json
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:6300
      # ingestion_api: read-write on ieq, read-only on the evidence catalog.
      ConnectionStrings__IeqDb: "Host=postgres;Port=5432;Database=ieq;Username=ingestion_api;Password=${INGESTION_API_DB_PASSWORD:?error}"
      ConnectionStrings__EvidenceDb: "Host=postgres;Port=5432;Database=evidence;Username=ingestion_api;Password=${INGESTION_API_DB_PASSWORD:?error}"
      # The API only enqueues; the worker drains the stream and writes to ieq.
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "6300:6300"
    volumes:
      - ./conf/vocabulary-extensions.json:/etc/ambiquality/vocabulary-extensions.json:ro
    networks:
      - db
      - public

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # ingestion_api role: read-write on ieq (the worker is the only measurements writer).
      ConnectionStrings__IeqDb: "Host=postgres;Port=5432;Database=ieq;Username=ingestion_api;Password=${INGESTION_API_DB_PASSWORD:?error}"
      ConnectionStrings__Redis: "redis:6379"
    networks:
      - db

  export-worker:
    build:
      context: .
      dockerfile: Dockerfile.export
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully
      evidence-migrate:
        condition: service_completed_successfully
    environment:
      Vocabulary__ExtensionsPath: /etc/ambiquality/vocabulary-extensions.json
      ConnectionStrings__IeqDb: "Host=postgres;Port=5432;Database=ieq;Username=export_worker;Password=${EXPORT_WORKER_DB_PASSWORD:?error}"
      # Read-only: resolve each observation's feature of interest (room at observation time).
      ConnectionStrings__EvidenceDb: "Host=postgres;Port=5432;Database=evidence;Username=export_worker;Password=${EXPORT_WORKER_DB_PASSWORD:?error}"
      Export__StorageType: ${EXPORT_STORAGE_TYPE:-FileSystem}
      Export__FileSystem__BasePath: /exports
      Export__S3__ServiceUrl: ${EXPORT_S3_SERVICE_URL:-}
      Export__S3__BucketName: ${EXPORT_S3_BUCKET_NAME:-}
      Export__S3__AccessKey: ${EXPORT_S3_ACCESS_KEY:-}
      Export__S3__SecretKey: ${EXPORT_S3_SECRET_KEY:-}
      Export__S3__PublicBaseUrl: ${EXPORT_S3_PUBLIC_BASE_URL:-}
    volumes:
      - ./conf/vocabulary-extensions.json:/etc/ambiquality/vocabulary-extensions.json:ro
      - export-data:/exports
    networks:
      - db
    profiles:
      - development

  auth-api: # on port 6100
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:6100
      ConnectionStrings__AuthDb: "Host=postgres;Port=5432;Database=auth;Username=auth_api;Password=${AUTH_API_DB_PASSWORD:?error}"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET:?error}
      Jwt__AccessTokenMinutes: "${JWT_ACCESS_TOKEN_MINUTES}"
      Jwt__RefreshTokenDays: "${JWT_REFRESH_TOKEN_DAYS}"
      Jwt__ConfirmationTokenHours: "${JWT_CONFIRMATION_TOKEN_HOURS}"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: "${SMTP_PORT}"
      # Empty for dev (Mailpit accepts any/no auth); a real relay requires both.
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__UseStartTls: "${SMTP_USE_STARTTLS}"
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      App__FrontendBaseUrl: ${APP_FRONTEND_BASE_URL}
    networks:
      - db
      - public

  public-api: # on port 6400 (read-only open-data API; never migrates)
    build:
      context: .
      dockerfile: Dockerfile.public
    depends_on:
      ingestion-migrate:
        condition: service_completed_successfully
      evidence-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      Vocabulary__ExtensionsPath: /etc/ambiquality/vocabulary-extensions.json
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:6400
      # public_api role: read-only on both ieq (measurements) and evidence (catalog).
      ConnectionStrings__IeqDb: "Host=postgres;Port=5432;Database=ieq;Username=public_api;Password=${PUBLIC_API_DB_PASSWORD:?error}"
      ConnectionStrings__EvidenceDb: "Host=postgres;Port=5432;Database=evidence;Username=public_api;Password=${PUBLIC_API_DB_PASSWORD:?error}"
      # Short-lived cache for the F18 map snapshot (the one call the map makes on load /
      # filter change). Degrades gracefully if Redis is down — see JsonDistributedCache.
      ConnectionStrings__Redis: "redis:6379"
      # Behind Caddy's path-stripping /public/* route; set the absolute base so
      # linked-data IRIs keep the public prefix.
      PublicApi__BaseIri: ${PUBLIC_API_BASE_IRI:-}
    ports:
      - "6400:6400"
    volumes:
      - ./conf/vocabulary-extensions.json:/etc/ambiquality/vocabulary-extensions.json:ro
    networks:
      - db
      - public

  caddy:
    image: docker.io/library/caddy:2.11.3-alpine
    networks:
      - public
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
      #- ./site:/srv # static files to serve

volumes:
  postgres-data:
  backup-data:
  pgadmin-data:
  mailpit-data:
  redis-data:
  caddy_data:
  caddy_config:
  export-data:

networks:
  db:
  public:
  
